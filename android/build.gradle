group 'com.revenuecat.purchases_flutter'
version '10.12.0'

buildscript {
    // Versions mirror purchases-hybrid-common's android/gradle/libs.versions.toml at
    // 18.38.0, the last release this plugin consumed before the hybridcommon sources
    // were vendored into src/main/kotlin.
    ext.kotlin_version = '2.0.21'
    ext.purchases_version = '10.21.0'
    ext.coroutines_version = '1.6.4'
    ext.junit5_plugin_version = '1.8.2.0'

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "de.mannodermaus.gradle.plugins:android-junit5:$junit5_plugin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// AGP 9 registers the `kotlin` extension itself when built-in Kotlin is enabled, and
// applying `kotlin-android` on top of it fails with "Cannot add extension with name
// 'kotlin'". Mirrors the guard purchases_ui_flutter already uses.
// https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-plugin-authors
if (project.extensions.findByName('kotlin') == null) {
    apply plugin: 'kotlin-android'
}
apply plugin: 'de.mannodermaus.android-junit5'

android {
    compileSdk 34

    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.revenuecat.purchases_flutter'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 21
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // purchases-android has two variants, but this library doesn't have any
        // Gradle doesn't know which variant of purchases-android to use when using
        // includeBuild and working with a local copy of purchases-android
        // https://developer.android.com/studio/build/build-variants#resolve_matching_errors
        missingDimensionStrategy 'apis', 'defaults'
        missingDimensionStrategy 'billingclient', 'bc8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    lintOptions {
        disable 'InvalidPackage'
    }
    buildTypes {
        release {
            consumerProguardFiles 'proguard-rules.pro'
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

// KGP < 1.9 has no `compilerOptions` on the `kotlin` extension; AGP's built-in Kotlin
// has no `kotlinOptions` on `android`. Mirrors purchases_ui_flutter.
def kotlinExtension = project.extensions.getByName('kotlin')
if (kotlinExtension.metaClass.respondsTo(kotlinExtension, 'compilerOptions')) {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
            languageVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_8
            apiVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_8
        }
    }
} else {
    android {
        kotlinOptions {
            jvmTarget = '1.8'
            languageVersion = '1.8'
            apiVersion = '1.8'
        }
    }
}

dependencies {
    // Mirrors purchases-hybrid-common's :hybridcommon module dependencies. `api` on the
    // purchases artifacts matches what hybridcommon exposed, so the vendored sources in
    // src/main/kotlin resolve the same types they did as a published dependency.
    api "com.revenuecat.purchases:purchases:$purchases_version"
    api "com.revenuecat.purchases:purchases-store-amazon:$purchases_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version"

    testImplementation "org.jetbrains.kotlin:kotlin-test:$kotlin_version"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$coroutines_version"
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.assertj:assertj-core:3.22.0'
    testImplementation 'io.mockk:mockk:1.12.8'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
}
