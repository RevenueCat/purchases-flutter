appId: com.revenuecat.automatedsdktests
name: Checkpoint custom error dialog

---
- clearState
- pressKey: home
- launchApp:
    arguments:
        e2e_test_flow: checkpoint_custom_error_dialog
        rc_test_api_key: "${typeof MAESTRO_RC_TEST_API_KEY === 'undefined' ? '' : MAESTRO_RC_TEST_API_KEY}"
- extendedWaitUntil:
    visible: "Hit checkpoint"
    timeout: 30000
- tapOn:
    text: "Hit checkpoint"
- extendedWaitUntil:
    visible: "Custom checkpoint error dialog"
    timeout: 20000
- assertVisible: "Got it"
- tapOn:
    text: "Got it"
- assertVisible: "Callback: not invoked"
