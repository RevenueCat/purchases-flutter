# This flow tests a checkpoint with an identifier that is not configured in the dashboard.
# Nothing is presented and the checkpoint passes right away with no flow,
# but the result still carries the customer's information.
# Mirrors purchases-android's maestro/checkpoints/checkpoint_unknown_identifier_passes_without_flow.yaml.

appId: com.revenuecat.automatedsdktests
name: Checkpoint unknown identifier passes without a flow

---
- clearState
- pressKey: home
- launchApp:
    arguments:
        e2e_test_flow: checkpoint_unknown_identifier
- extendedWaitUntil:
    visible: "Hit checkpoint"
    timeout: 30000
- tapOn:
    text: "Hit checkpoint"
- extendedWaitUntil:
    visible: 'Callback: passed, no flow \(call #1\)'
    timeout: 20000
- assertVisible: "Obtained products: none"
- assertVisible: "Entitlement pro obtained: false"
- assertVisible: "Product pro_monthly_subscription obtained: false"
- assertVisible: "Customer active entitlements: none"
