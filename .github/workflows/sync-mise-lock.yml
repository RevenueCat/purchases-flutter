name: Sync mise.lock

# Renovate's mise manager can bump the version pin in mise.toml, but the org's
# self-hosted Renovate doesn't have permission to run `mise lock` (that's
# gated behind allowedUnsafeExecutions, which is a global, org-wide setting
# we're deliberately not granting). So Renovate's PR leaves mise.lock stale.
# This workflow regenerates it and pushes the fix onto the same branch.

on:
  pull_request:

permissions:
  contents: write

jobs:
  sync-mise-lock:
    if: startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Install mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: false

      - name: Regenerate mise.lock
        run: |
          mise install
          mise lock --platform linux-arm64 --platform linux-x64 --platform macos-arm64 --platform macos-x64 --platform windows-x64

      - name: Commit and push mise.lock if changed
        run: |
          if git diff --exit-code mise.lock; then
            echo "mise.lock already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add mise.lock
            git commit -m "Update mise.lock for mise.toml changes"
            git push origin HEAD:${{ github.head_ref }}
          fi
