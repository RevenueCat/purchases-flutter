name: Sync mise.lock

# Renovate's mise manager can bump the version pin in mise.toml, but the org's
# self-hosted Renovate doesn't have permission to run `mise lock` (that's
# gated behind allowedUnsafeExecutions, which is a global, org-wide setting
# we're deliberately not granting). So Renovate's PR leaves mise.lock stale.
# This workflow regenerates it and pushes the fix onto the same branch.

on:
  pull_request:

permissions:
  contents: write

jobs:
  sync-mise-lock:
    if: startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Install mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: false

      - name: Configure git identity
        env:
          GIT_BOT_USERNAME: ${{ secrets.GIT_BOT_USERNAME }}
          GIT_BOT_EMAIL: ${{ secrets.GIT_BOT_EMAIL }}
        run: |
          git config user.name "$GIT_BOT_USERNAME"
          git config user.email "$GIT_BOT_EMAIL"

      - name: Install gems
        run: mise exec -- bundle install

      - name: Sync mise.lock
        run: mise exec -- bundle exec fastlane sync_mise_lock
