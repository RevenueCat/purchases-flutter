android.useAndroidX=true

# KGP cannot work with AGP's new DSL (it casts the android extension to
# BaseExtension, which the new LibraryExtensionImpl is not), so the legacy
# Kotlin path requires opting out of it. Pinned off for both cases so the two
# runs in run.sh differ only by `android.builtInKotlin`.
android.newDsl=false
