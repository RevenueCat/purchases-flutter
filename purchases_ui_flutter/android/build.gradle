group 'com.revenuecat.purchases_ui_flutter'
version '10.11.0'

buildscript {
    ext.kotlin_version = '1.9.20'
    ext.common_version = '18.36.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// AGP 9 registers the `kotlin` extension itself when built-in Kotlin is enabled, and applying
// `kotlin-android` on top of it fails with "Cannot add extension with name 'kotlin'". Must stay
// below `com.android.library`, since that apply is what registers the extension.
// https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-plugin-authors
if (project.extensions.findByName('kotlin') == null) {
    apply plugin: 'kotlin-android'
}

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.revenuecat.purchases_ui_flutter'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 24
        compileSdk 34
        // Fix variant resolution for purchases-android local builds
        missingDimensionStrategy 'apis', 'defaults'
        missingDimensionStrategy 'billingclient', 'bc8'
    }
    
    dependencies {
        implementation "com.revenuecat.purchases:purchases-hybrid-common-ui:$common_version"
        implementation 'androidx.compose.ui:ui-android:1.5.4'
    }
}

// KGP < 1.9 has no `compilerOptions` on the `kotlin` extension; AGP's built-in Kotlin has no
// `kotlinOptions` on `android`.
def kotlinExtension = project.extensions.getByName('kotlin')
if (kotlinExtension.metaClass.respondsTo(kotlinExtension, 'compilerOptions')) {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
        }
    }
} else {
    android {
        kotlinOptions {
            jvmTarget = '1.8'
        }
    }
}
