group 'com.revenuecat.purchases_ui_flutter'
version '12.0.0'

buildscript {
    ext.kotlin_version = '2.2.21'
    ext.common_version = '21.0.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
if (agpMajor < 9) {
    pluginManager.apply('kotlin-android')
}

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.revenuecat.purchases_ui_flutter'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets.named('main') {
        kotlin.directories.add('src/main/kotlin')
    }

    defaultConfig {
        minSdkVersion 24
        compileSdk 35
        // Fix variant resolution for purchases-android local builds
        missingDimensionStrategy 'apis', 'defaults'
        missingDimensionStrategy 'billingclient', 'bc8'
    }
    
    dependencies {
        implementation "com.revenuecat.purchases:purchases-hybrid-common-ui:$common_version"
        implementation 'androidx.compose.ui:ui-android:1.5.4'
        testImplementation 'junit:junit:4.13.2'
        testImplementation 'io.mockk:mockk:1.13.11'
    }
}

// KGP < 1.9 has no `compilerOptions` on the `kotlin` extension; AGP's built-in Kotlin has no
// `kotlinOptions` on `android`.
def kotlinExtension = project.extensions.getByName('kotlin')
if (kotlinExtension.metaClass.respondsTo(kotlinExtension, 'compilerOptions')) {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
        }
    }
} else {
    android {
        kotlinOptions {
            jvmTarget = '1.8'
        }
    }
}
